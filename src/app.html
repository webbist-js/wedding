		<link rel="manifest" href="/manifest.webmanifest" />

		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />

			rel="stylesheet"
		/>
		<style>
			/* First-load page loader: the botanical animation plays once, then
			   fades to reveal the page. Rendered here in app.html so it covers
			   the very first paint before hydration. Driven by the script at the
			   end of <body>. */
			#ka-loader {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				background: #efece3;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: opacity 0.8s ease;
			}
			#ka-loader video {
				width: 100%;
				height: 100%;
				object-fit: cover;
				pointer-events: none;
			}
			#ka-loader.ka-done {
				opacity: 0;
			}
			@media (prefers-reduced-motion: reduce) {
				#ka-loader {
					display: none;
				}
			}
		</style>
		%sveltekit.head%
		<noscript>
			<style>
				[data-reveal] {
					opacity: 1 !important;
					transform: none !important;
				}
			</style>
		</noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
